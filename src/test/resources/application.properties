spring.sql.init.mode=never

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

bootstrap.admin.codigo=admin
bootstrap.admin.contrasena=admin123
bootstrap.admin.dni=00000000
bootstrap.admin.nombre=Admin
bootstrap.admin.apellido=Principal

# Desactivar BootstrapRunner en tests (los tests siembran admin en @BeforeEach)
app.bootstrap.enabled=false
