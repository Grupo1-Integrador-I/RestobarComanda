name: CI — Build & Test

on:
  push:
    branches: [ main, develop, Inici4rSesi0n ]
  pull_request:
    branches: [ main, develop, Inici4rSesi0n ]

permissions:
  contents: read

jobs:
  build:
    name: Build y pruebas con Maven
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: restobar
          POSTGRES_USER: restobar
          POSTGRES_PASSWORD: restobar
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout del código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar el proyecto
        run: mvn -B clean compile --file pom.xml

      - name: Ejecutar pruebas unitarias
        run: mvn -B test --file pom.xml
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/restobar
          SPRING_DATASOURCE_USERNAME: restobar
          SPRING_DATASOURCE_PASSWORD: restobar
          SPRING_DATASOURCE_DRIVER: org.postgresql.Driver

      - name: Empaquetar (sin tests, ya ejecutados)
        run: mvn -B package -DskipTests --file pom.xml

      - name: Subir artefacto JAR
        uses: actions/upload-artifact@v4
        with:
          name: restobar-comanda-jar
          path: target/*.jar
          retention-days: 7
